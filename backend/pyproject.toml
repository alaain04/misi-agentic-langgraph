[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "misi-agentic"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.1",
    "langchain>=1.0,<2.0",
    "langchain-core>=1.0,<2.0",
    "langchain-mongodb>=0.11.0",
    "langchain-openai>=1.2.0",
    "langgraph>=1.0,<2.0",
    "langsmith>=0.3.0",
    "httpx>=0.27.0",
    "pydantic-settings>=2.14.0",
    "pymongo>=4.17.0",
    "uvicorn[standard]>=0.46.0",
]

[project.scripts]
dev = "src._scripts:dev"
lint = "src._scripts:lint"
format = "src._scripts:fmt"
test = "src._scripts:test"
curl-test = "src._scripts:curl_test"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
