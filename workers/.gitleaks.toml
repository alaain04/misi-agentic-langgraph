# Gitleaks configuration
# https://github.com/gitleaks/gitleaks#configuration

[extend]
# Use the default gitleaks rules as a base
useDefault = true

[allowlist]
description = "Allowlist for known false positives"
paths = [
    # detect-secrets baseline file contains hashed representations of detected
    # secrets (not real secrets). Gitleaks incorrectly flags the hash values
    # themselves as generic-api-key findings.
    ".secrets.baseline",
]
