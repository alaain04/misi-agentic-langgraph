[project]
name = "entity-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic-settings>=2.7.0",
    "nats-py>=2.9.0",
    "pymongo>=4.12.0",
    "httpx>=0.28.0",
    "redis[hiredis]>=5.2.0",
    "structlog>=25.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "adapters", "api", "config", "domain", "services",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = [".", "api", "domain", "adapters", "services", "config"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "S",   # flake8-bandit (security)
    "ANN", # flake8-annotations (type hints)
]
ignore = [
    "ANN401",  # Any is legitimate in cache ports/adapters (JSON values)
    "S101",    # use of assert (OK in tests)
    "S104",    # binding to 0.0.0.0 is intentional in containerised services
    "UP046",   # old-style Generic[T] is more readable and widely understood
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN"]
"api/routers/*" = ["B008"]  # FastAPI Depends() in function signatures is the intended pattern

[tool.ruff.lint.isort]
known-first-party = ["api", "domain", "adapters", "services", "config"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
explicit_package_bases = true
exclude = ["tests/", "alembic/", "venv/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v"

[tool.coverage.run]
omit = ["tests/*", "alembic/*", "scripts/*"]

[[tool.mypy.overrides]]
# FastAPI router decorators are untyped; disabling this check per-file is
# the standard approach in strict mode.
module = ["api.routers.*", "main"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
# Pydantic BaseModel and SQLAlchemy DeclarativeBase resolve to Any when their
# stubs are not installed (e.g. fresh environment before `make install-dev`).
# In CI all stubs are installed; this override avoids false positives locally.
module = ["api.schemas", "adapters.db.sqlalchemy.models", "config.settings"]
disallow_subclassing_any = false

[[tool.mypy.overrides]]
# types-redis presence is environment-dependent: installed in CI, absent locally.
# A per-module error-code disable avoids the "unused type: ignore" /
# "stubs not installed" flip-flop between environments.
module = ["adapters.cache.redis_adapter"]
disable_error_code = ["import-untyped"]

[tool.bandit]
exclude_dirs = ["tests", "scripts", "venv"]
skips = [
    "B101",  # assert_used — OK in tests (excluded above)
    "B104",  # hardcoded_bind_all_interfaces — intentional in containerised services
]
