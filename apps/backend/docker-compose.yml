services:
  mongodb:
    image: mongo:8
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  codegraph:
    build:
      context: ./docker/codegraph
    image: codegraph-cli:latest
    profiles:
      - build-only
    command: ["true"]

  gh:
    build:
      context: ./docker/gh
    image: gh-cli:latest
    profiles:
      - build-only
    command: ["true"]

volumes:
  mongodb_data:
